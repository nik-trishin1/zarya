<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · link-qr</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --ink: #1c1a17;
      --muted: #5c564e;
      --line: #d9d2c8;
      --accent: #0f6b5c;
      --accent-ink: #f4fffb;
      --danger: #8b2e2e;
      --card: #fffdf9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, #efe6d8 0%, transparent 45%),
        radial-gradient(circle at 90% 20%, #dceee9 0%, transparent 40%),
        var(--bg);
      min-height: 100vh;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 0.35rem;
    }
    .brand {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      margin-bottom: 1.5rem;
    }
    p, label { color: var(--muted); }
    .error {
      background: #f8e8e8;
      color: var(--danger);
      border: 1px solid #e2bdbd;
      padding: 0.75rem 1rem;
      margin: 1rem 0;
    }
    form {
      display: grid;
      gap: 0.9rem;
      margin-top: 1.25rem;
    }
    label {
      display: grid;
      gap: 0.35rem;
      font-size: 0.95rem;
    }
    input[type="text"], input[type="url"], input[type="password"] {
      width: 100%;
      padding: 0.7rem 0.8rem;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      font: inherit;
    }
    button, .button {
      display: inline-block;
      border: none;
      background: var(--accent);
      color: var(--accent-ink);
      padding: 0.75rem 1.1rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }
    .row {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: 1fr 1fr;
    }
    @media (max-width: 560px) {
      .row { grid-template-columns: 1fr; }
    }
    .box {
      border: 1px solid var(--line);
      background: var(--card);
      padding: 1rem 1.1rem;
      margin: 1rem 0;
    }
    code, .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.92rem;
      word-break: break-all;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.5rem 0 1.25rem;
      font-size: 0.95rem;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      text-align: left;
      padding: 0.45rem 0.25rem;
    }
    img.qr {
      width: 180px;
      height: 180px;
      image-rendering: pixelated;
      border: 1px solid var(--line);
      background: white;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <main>
    <div class="brand">link-qr</div>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
